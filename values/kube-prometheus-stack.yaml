# kube-prometheus-stack values for local kind.
# Chart: prometheus-community/kube-prometheus-stack v84.5.0 (appVersion v0.90.1)
# Mirrors edp-cluster-add-ons/clusters/core/addons/prometheus-operator/values.yaml
# (there nested under the `prometheus-operator` alias; root-level here).

crds:
  enabled: true

prometheus:
  # Expose the Prometheus API at a stable nip.io URL so the Portal (run from source)
  # can fetch deployment metrics for the Stage Monitoring tab — same pattern as the
  # Tekton Results / gitfusion ingresses. Portal env: PROMETHEUS_URL=http://prometheus.127.0.0.1.nip.io
  # Plain HTTP, no auth (local testbed only). Service is prometheus-kube-prometheus-prometheus:9090.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.127.0.0.1.nip.io
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    # Pick up ALL ServiceMonitors/PodMonitors, not just Helm-labelled ones — so
    # Tekton Results' ServiceMonitor and any KRCI component metrics are scraped.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Small footprint for a laptop kind cluster; ephemeral (no PVC).
    retention: 7d
    resources: {}

grafana:
  enabled: true
  # Local-only default admin password (matches the add-ons repo default).
  adminPassword: prom-operator
  # Expose Grafana at a stable nip.io URL (same pattern as the Prometheus ingress
  # above) so it's reachable without a port-forward. Plain HTTP, no TLS (local only).
  # NB: the grafana subchart uses a single `path:` string (not `paths:` like the
  # prometheus block). Served at root on a dedicated host, so no serve_from_sub_path.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.127.0.0.1.nip.io
    path: /
    pathType: Prefix

# Keep the footprint small on kind — no Alertmanager.
alertmanager:
  enabled: false
