# kube-prometheus-stack values for local kind (version: Makefile PROM_CHART_VERSION).
# Keys match edp-cluster-add-ons/clusters/core/addons/prometheus-operator/values.yaml, which
# nests them under the `prometheus-operator` alias; root-level here.

crds:
  enabled: true

prometheus:
  # Expose the Prometheus API at a stable nip.io URL for off-cluster access
  # (PROMETHEUS_URL in the Portal .env — see `make status`); the in-cluster Portal
  # uses the Service directly. Plain HTTP, no auth (local testbed only).
  # Service is prometheus-kube-prometheus-prometheus:9090.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.127.0.0.1.nip.io
    paths:
      - /
    pathType: Prefix
  prometheusSpec:
    # Scrape all ServiceMonitors/PodMonitors, not only Helm-labelled ones (Tekton Results,
    # KRCI components).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Ephemeral: no PVC.
    retention: 7d
    resources: {}

grafana:
  enabled: true
  # Local-only admin password.
  adminPassword: prom-operator
  # Stable nip.io URL, plain HTTP. The grafana subchart takes a single `path:` (the
  # prometheus block takes `paths:`). Served at root on its own host: no serve_from_sub_path.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.127.0.0.1.nip.io
    path: /
    pathType: Prefix

alertmanager:
  enabled: false

# kube-state-metrics: emit the app.kubernetes.io/instance pod label as
# `kube_pod_labels{label_app_kubernetes_io_instance="…"}`. The Portal Monitoring tab
# (getDeploymentMetrics) joins container metrics to codebases on it; KSM omits label_*
# series unless allow-listed, and the tab then degrades to live pods only (server logs
# `hasKubePodLabels=false`).
kube-state-metrics:
  extraArgs:
    - --metric-labels-allowlist=pods=[app.kubernetes.io/instance]
