# krci-portal as a standalone snapshot release — the `krci-portal:` section of
# values/edp-install.yaml flattened to top level (keep the two in sync).

image:
  # The arm64 image variant crashes on better_sqlite3 ("unsupported relocation
  # type 7") — pin the amd64 digest, which runs under Docker Desktop's Rosetta.
  # name:tag@digest → digest wins. When bumping, re-pin with:
  #   docker manifest inspect epamedp/krci-portal:<tag>   (take the amd64 digest)
  tag: "0.9.0-SNAPSHOT.6@sha256:74ed4382602470bedfad75094b1c345d8243e062ba9d5061ab69ef975665bb58"

configEnv:
  # No OIDC issuer in kind. An empty issuer flips the server's oidcEnabled off,
  # which hides all SSO controls and makes the login screen ServiceAccount-token
  # only (mint one with `make token`). Overrides the chart's example-issuer default.
  OIDC_ISSUER_URL: ""
  PORTAL_URL: https://portal.127.0.0.1.nip.io
  TEKTON_RESULTS_URL: http://tekton-results-api-service.tekton-pipelines.svc:8080
  SONAR_HOST_URL: http://sonar.sonar:9000          # in-cluster API endpoint
  SONAR_WEB_URL: https://sonar.127.0.0.1.nip.io    # public ingress for browser links (https-only)
  PROMETHEUS_URL: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090

# configEnv reaches the pod via this configMapRef; secretRef adds the sensitive env
# (manifests/krci-portal-secret.yaml, applied by `make krci` before the chart).
extraEnvFrom:
  - configMapRef:
      name: portal-config
  - secretRef:
      name: krci-portal-secret

ingress:
  enabled: true
  className: nginx
  # The session cookie is Secure and PORTAL_URL is the https origin, so a session
  # can never be established over plain http (login succeeds, cookie is dropped,
  # the UI bounces back to session-expired). Force http -> https at the ingress.
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  dnsWildcard: "127.0.0.1.nip.io"
  hosts:
    - host: portal.127.0.0.1.nip.io
      paths:
        - path: /
          pathType: Prefix
