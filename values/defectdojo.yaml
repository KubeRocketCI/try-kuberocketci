# DefectDojo (KRCI security findings store: CI `security` / `image-scan` uploads, krci-security-operator,
# Portal security views) for the local kind testbed: upstream chart defectdojo/defectdojo, values
# derived from edp-cluster-add-ons (clusters/core/addons/defectdojo/values.yaml). Local deviations:
#   * DB + broker: the chart's bundled PostgreSQL and Valkey (single instance, 2Gi PVCs) in place of
#     the add-ons' Crunchy PGO cluster; no manifest of our own.
#   * Secrets generated by the chart once (pre-install hook, resource-policy keep): `defectdojo`
#     (DD_ADMIN_PASSWORD), `defectdojo-postgresql-specific`, `defectdojo-valkey-specific`.
#     `make defectdojo-down` deletes the namespace, which removes them.
#   * SSO off, ESO off, no Keycloak client: login is `admin` + the generated password.
#   * plain http: activateTLS false sets DD_SESSION_COOKIE_SECURE / DD_CSRF_COOKIE_SECURE to False, so
#     the UI login works. No ssl redirect: the krci-security-operator client verifies TLS and has no
#     insecure option, so it needs an http URL.
#   * ingress host -> defectdojo.127.0.0.1.nip.io (nginx).
# Targets chart 1.9.70 (DefectDojo 3.5.200); renders unchanged with 1.9.12 (2.55.2, the add-ons pin).
# One replica each (chart default): django (uwsgi + nginx), celery worker (solo pool), celery beat,
# valkey, postgresql. The worker runs the post-import processing, so it stays.

host: defectdojo.127.0.0.1.nip.io
siteUrl: http://defectdojo.127.0.0.1.nip.io
# DD_ALLOWED_HOSTS = host + these: in-cluster Service names, port-forward on localhost.
alternativeHosts:
  - defectdojo-django.defectdojo
  - defectdojo-django.defectdojo.svc
  - defectdojo-django.defectdojo.svc.cluster.local
  - localhost
# Chart default is Always.
imagePullPolicy: IfNotPresent

createSecret: true
createPostgresqlSecret: true
createValkeySecret: true

django:
  ingress:
    enabled: true
    ingressClassName: nginx
    activateTLS: false
    annotations:
      # Trivy reports reach 3 MB; nginx default is 1m.
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
  uwsgi:
    appSettings:
      # Chart default 4; the 512Mi limit stays.
      processes: 2
      # Chart default 0 = detect: kind's containerd nofile is ~1e9 and uwsgi sizes its fd tables to
      # it, OOMKilled at any limit. 102400 -> ~320Mi with 2 processes.
      maxFd: 102400

postgresql:
  primary:
    persistence:
      size: 2Gi

valkey:
  persistence:
    size: 2Gi
