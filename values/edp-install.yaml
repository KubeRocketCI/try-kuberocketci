# KubeRocketCI (edp-install) values for LOCAL kind testing.
# Chart: epamedp/edp-install 3.14.1  (verified against the chart's own values.yaml)
#
# Stack that comes up with these values:
#   codebase-operator, cd-pipeline-operator, edp-tekton (pipelines library),
#   gitfusion, krci-portal (in-cluster). Legacy edp-headlamp + gerrit stay off.
# Argo CD, a container registry, and GitLab are added in later phases.

global:
  # kubernetes (not openshift)
  platform: "kubernetes"
  # Wildcard DNS -> every ingress host becomes <name>.127.0.0.1.nip.io and
  # resolves to localhost, where the kind NGINX ingress listens on 80/443.
  dnsWildCard: "127.0.0.1.nip.io"

  # Git providers the platform manages. Default github for milestone 1; we switch
  # to gitlab in the git phase (scripts/gitlab.sh).
  gitProviders:
    - gitlab

  # Container registry used by build pipelines to push images. We reuse the
  # self-hosted GitLab Container Registry (on :5050). KRCI has no "gitlab" type,
  # so we declare it as a generic private registry ("harbor"): kaniko just pushes
  # to <url>/<space>/<codebase>. With space=krci that maps to each codebase's own
  # GitLab project registry (krci/<codebase>). Requires `make gitlab` first.
  dockerRegistry:
    type: "harbor"
    url: "gitlab.127.0.0.1.nip.io:5050"
    space: "krci"

# edp-tekton (pipelines library) configuration.
edp-tekton:
  # The Tekton Reporter publishes review-pipeline reports as MR comments over the
  # GitLab HTTPS API, so it needs the self-signed CA like gitfusion does — without
  # it every publish fails x509 "unknown authority" and MRs get no report comment.
  # Same declarative mount of cm `gitlab-ca` (created by scripts/gitlab-up.sh) into
  # /etc/ssl/certs, which Go scans on top of the system bundle. Failed-step log
  # tails are always published by chart 0.26.0 (the off-by-default `logsReporting`
  # switch ships in the next edp-tekton release; add `logsReporting: true` here
  # when bumping EDP_VERSION past it to keep logs visible).
  reporter:
    extraVolumes:
      - name: gitlab-ca
        configMap:
          name: gitlab-ca
    extraVolumeMounts:
      - name: gitlab-ca
        mountPath: /etc/ssl/certs/gitlab-ca.crt
        subPath: gitlab-ca.crt
        readOnly: true

  # Tell the kaniko build task that the registry uses a custom (self-signed) cert.
  # Flips `custom_certs=true` and mounts the CA at /kaniko/.custom-certs/ca.crt from
  # secret `custom-ca-certificates` (key ca.crt), created by scripts/gitlab-up.sh.
  # Without it, kaniko push fails TLS verification.
  kaniko:
    customCert: true

  # DECLARATIVE GitServer: the chart renders the GitServer CR + EventListener
  # (edp-gitlab) + its Ingress (event-listener-gitlab) from this map — replacing
  # the imperative `kubectl apply GitServer` + EL-readiness polling. It references
  # the `ci-gitlab` secret (token/id_rsa/secretString) which scripts/gitlab-up.sh
  # creates BEFORE this chart installs, so the GitServer connects on first reconcile.
  # The operator does not create a duplicate EL (it defers when one already exists).
  gitServers:
    gitlab:
      gitProvider: gitlab
      host: gitlab.127.0.0.1.nip.io
      gitUser: git
      httpsPort: 443
      sshPort: 32222
      nameSshKeySecret: ci-gitlab
      webhook:
        skipWebhookSSLVerification: true
      eventListener:
        enabled: true
        ingress:
          enabled: true

# gitfusion serves the Portal's git-provider operations (repository discovery,
# branch/PR listing) via a REST API on :8080. The in-cluster Portal reaches it at
# gitfusion.krci:8080; this ingress also exposes it at a stable nip.io URL for
# off-cluster access (GITFUSION_URL in the Portal .env — see `make status`). Plain
# HTTP (the service is HTTP; auth is the kube token the Portal forwards).
gitfusion:
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: gitfusion.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
  # Trust the GitLab self-signed CA. gitfusion reaches GitLab over HTTPS with the
  # self-signed cert, so without this its discovery calls fail x509 "unknown
  # authority" (the symptom: Portal shows no repos). Declarative mount of cm
  # `gitlab-ca` (created by scripts/gitlab-up.sh BEFORE this chart installs) at
  # /etc/ssl/certs/gitlab-ca.crt — Go scans that dir on top of the system bundle, so
  # public CAs still work. Applied at `make krci` time, so gitfusion trusts the CA on
  # first start (no post-install patch / restart). Same CA the codebase-operator gets.
  volumes:
    - name: gitlab-ca
      configMap:
        name: gitlab-ca
  volumeMounts:
    - name: gitlab-ca
      mountPath: /etc/ssl/certs/gitlab-ca.crt
      subPath: gitlab-ca.crt
      readOnly: true

# We are NOT using External Secrets Operator locally. Disable it AND the
# install-secret management so the chart does not create ExternalSecret objects
# that would never resolve (no AWS/SecretStore in a kind cluster).
externalSecrets:
  enabled: false
  manageEDPInstallSecrets: false

# In-cluster Portal (edp-install subchart krci-portal 0.6.0). Token login is OIDC-only
# and kind has no issuer, so the pod is Ready and serves the UI over HTTPS but login is
# not wired (needs SA-token support). configEnv overrides only the endpoints the chart
# placeholders don't resolve to; the rest keep chart defaults via deep merge.
krci-portal:
  enabled: true

  image:
    # amd64 image (arm64 variant has a better_sqlite3 bug); runs under Docker Desktop's
    # Rosetta, like gitlab-ce/sonar-operator. name:tag@digest → digest wins; re-pin on bump.
    tag: "0.6.0@sha256:687e8ccb9b5add62391490268042c685ad69f434c9ee77fcb07865071aa2c1cb"

  configEnv:
    PORTAL_URL: https://portal.127.0.0.1.nip.io
    TEKTON_RESULTS_URL: http://tekton-results-api-service.tekton-pipelines.svc:8080
    SONAR_HOST_URL: http://sonar.sonar:9000          # in-cluster API endpoint
    SONAR_WEB_URL: http://sonar.127.0.0.1.nip.io     # public ingress for browser links
    PROMETHEUS_URL: http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090

  # The chart renders envFrom from extraEnvFrom only (no auto-mount of portal-config), so
  # configEnv reaches the pod via this configMapRef; secretRef adds the sensitive env.
  extraEnvFrom:
    - configMapRef:
        name: portal-config
    - secretRef:
        name: krci-portal-secret

  ingress:
    enabled: true
    className: nginx
    dnsWildcard: "127.0.0.1.nip.io"
    hosts:
      - host: portal.127.0.0.1.nip.io
        paths:
          - path: /
            pathType: Prefix
