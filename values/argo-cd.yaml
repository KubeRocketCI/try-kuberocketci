# Argo CD values for local kind — KubeRocketCI CD engine. Chart: argo/argo-cd
# (https://argoproj.github.io/argo-helm; version: Makefile ARGOCD_CHART_VERSION).
# Single instance: one replica per component, one Redis (KRCI docs describe a shared HA
# install: https://docs.kuberocketci.io/docs/operator-guide/cd/argocd-integration).
# Repo credentials and the argocd-ci secret: scripts/argocd-integrate.sh (post-krci).

global:
  domain: argocd.127.0.0.1.nip.io
  # Chart >= 10 defaults to true; kindnet enforces NetworkPolicy.
  networkPolicy:
    create: false

# --- single-instance footprint ---------------------------------------------------
dex:
  enabled: false          # no SSO in kind
notifications:
  enabled: false
applicationSet:
  # Required: the cd-pipeline-operator renders an ApplicationSet (named after the
  # CDPipeline) in ns krci; the ApplicationSet controller turns it into Applications.
  # At 0 replicas a deploy produces no Application (Stage looks fine, nothing syncs).
  replicas: 1

configs:
  # argocd-cmd-params-cm
  params:
    # The cd-pipeline-operator creates Application CRs in ns krci (apps-in-any-namespace);
    # without this the controller/server watch only the argocd ns.
    application.namespaces: krci
    # Same for ApplicationSets: KRCI puts the ApplicationSet in ns krci; unwatched, it
    # generates no Application.
    applicationsetcontroller.namespaces: krci
    # apps-in-any-namespace for ApplicationSets requires SCM providers disabled (or an
    # allowlist); otherwise the appset controller refuses to start. No SCM generators here.
    applicationsetcontroller.enable.scm.providers: "false"
    # Plain HTTP: the nginx ingress terminates TLS (no passthrough).
    server.insecure: true

  # argocd-cm
  cm:
    # Local account; scripts/argocd-integrate.sh mints its non-expiring API token into
    # secret argocd-ci (ns krci) for KRCI's Argo CD API calls.
    accounts.krci-ci: apiKey
    # PipelineRun/TaskRun churn is not tracked as Argo CD resources.
    resource.exclusions: |
      - apiGroups:
        - tekton.dev
        kinds:
        - PipelineRun
        - TaskRun
        clusters:
        - "*"

  # argocd-rbac-cm: krci-ci gets role:admin (local only); the cd-pipeline-operator manages
  # Applications/Projects with its token.
  rbac:
    policy.csv: |
      g, krci-ci, role:admin

# --- ingress (HTTP; pairs with server.insecure) ----------------------------------
server:
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: argocd.127.0.0.1.nip.io
    path: /
    pathType: Prefix
