# Envoy proxy data-plane metrics (/stats/prometheus :19001) for the Portal Networking tab.
# Label release=prometheus: the kube-prometheus-stack PodMonitor selector (match-all in
# values/kube-prometheus-stack.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
