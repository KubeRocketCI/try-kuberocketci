# Scrapes Envoy Gateway data-plane proxy metrics (/stats/prometheus :19001) into
# kube-prometheus-stack, so the Networking tab can show real traffic on the graph.
# Idempotent. release:prometheus label matches the stack's (match-all) selector.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames: [envoy-gateway-system]
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/name: envoy
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 15s
