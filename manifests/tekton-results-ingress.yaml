# Tekton Results API for the Portal (TEKTON_RESULTS_URL=http://tekton-results.127.0.0.1.nip.io).
# The API serves REST (gRPC-gateway) on :8080 over plain HTTP: the KRCI Results manifest
# disables TLS and sets AUTH_DISABLE. Local testbed only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tekton-results-api
  namespace: tekton-pipelines
  annotations:
    # Log and record-list responses are large; no body cap.
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  rules:
    - host: tekton-results.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tekton-results-api-service
                port:
                  number: 8080
