# Self-hosted GitLab CE, single omnibus pod, laptop-sized. First boot 3-6 min; Docker >= 12GB.
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
# /etc/gitlab holds gitlab-secrets.json (DB encryption keys). Without persistence each
# restart regenerates the keys while gitlab-data keeps rows encrypted under the old
# ones -> OpenSSL CipherError on encrypted columns (e.g. ApplicationSetting).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
spec:
  replicas: 1
  # First boot (reconfigure + migrations) exceeds the 600s default ->
  # ProgressDeadlineExceeded and a spurious `kubectl rollout status` failure.
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:17.5.1-ce.0
          env:
            # From secret gitlab-root-password (Makefile GITLAB_ROOT_PASSWORD via
            # scripts/gitlab-up.sh). Read by initial_root_password below.
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-root-password
                  key: password
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                # HTTPS is required: the codebase-operator's GitLab REST client uses https://
                # only (the GitServer CRD has httpsPort, no scheme); plain HTTP fails
                # project/webhook creation with "server gave HTTP response to HTTPS client".
                # TLS terminates on the omnibus with the self-signed cert from secret
                # gitlab-tls (/etc/gitlab-tls), so SSH (32222) and HTTPS share one host and
                # one CoreDNS rewrite.
                external_url 'https://gitlab.127.0.0.1.nip.io'
                # Read only when root is first created (no-op on an existing data PVC).
                # nil -> omnibus generates a random password.
                gitlab_rails['initial_root_password'] = ENV['GITLAB_ROOT_PASSWORD']
                nginx['listen_port'] = 443
                nginx['listen_https'] = true
                nginx['ssl_certificate'] = '/etc/gitlab-tls/tls.crt'
                nginx['ssl_certificate_key'] = '/etc/gitlab-tls/tls.key'
                nginx['redirect_http_to_https'] = false
                gitlab_rails['gitlab_shell_ssh_port'] = 32222
                # The kubelet readiness probe calls /-/health from the pod-network gateway
                # (10.244.0.1); GitLab restricts monitoring endpoints to 127.0.0.0/8 by
                # default and answers 404 otherwise.
                gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '10.244.0.0/16']
                # --- minimal footprint ---
                # 0 = Puma single mode (lowest RSS).
                puma['worker_processes'] = 0
                puma['min_threads'] = 1
                puma['max_threads'] = 4
                sidekiq['max_concurrency'] = 5
                postgresql['shared_buffers'] = "128MB"
                postgresql['max_worker_processes'] = 4
                # Monitoring/exporters off.
                prometheus_monitoring['enable'] = false
                prometheus['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                # No grafana key: not part of omnibus since 16.0.
                # Container Registry = KubeRocketCI's image registry: :5050, TLS with the same
                # cert; build pods push to gitlab.127.0.0.1.nip.io:5050/<group>/<project>.
                registry['enable'] = true
                registry_external_url 'https://gitlab.127.0.0.1.nip.io:5050'
                registry_nginx['ssl_certificate'] = '/etc/gitlab-tls/tls.crt'
                registry_nginx['ssl_certificate_key'] = '/etc/gitlab-tls/tls.key'
                # Unused locally.
                gitlab_kas['enable'] = false
                gitlab_pages['enable'] = false
                mattermost['enable'] = false
          ports:
            - containerPort: 443
              name: https
            - containerPort: 22
              name: ssh
            - containerPort: 5050
              name: registry
          readinessProbe:
            httpGet:
              path: /-/health
              port: 443
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 80
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/opt/gitlab
            - name: config
              mountPath: /etc/gitlab
            - name: tls
              mountPath: /etc/gitlab-tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-data
        - name: config
          persistentVolumeClaim:
            claimName: gitlab-config
        - name: tls
          secret:
            # Self-signed cert for gitlab.127.0.0.1.nip.io; scripts/gitlab-up.sh creates it
            # before applying this Deployment.
            secretName: gitlab-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab
  namespace: gitlab
spec:
  selector:
    app: gitlab
  ports:
    - name: https
      port: 443
      targetPort: 443
    - name: ssh
      port: 22
      targetPort: 22
    # GitLab advertises clone URLs on 32222 (gitlab_shell_ssh_port) and the GitServer CR
    # sets sshPort: 32222; the codebase-operator's SSH check and git clone dial
    # gitlab.<wildcard>:32222 (CoreDNS -> this Service) -> in-container sshd on 22.
    - name: ssh-ext
      port: 32222
      targetPort: 22
    # Container registry (registry_external_url :5050); build pods reach
    # gitlab.127.0.0.1.nip.io:5050 via CoreDNS -> this Service.
    - name: registry
      port: 5050
      targetPort: 5050
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    # GitLab terminates TLS on 443; ingress-nginx re-encrypts to the backend.
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gitlab.127.0.0.1.nip.io
      secretName: gitlab-tls
  rules:
    - host: gitlab.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 443
