# KubeRocketCI AppProject. Applied by `make argocd` (the argo-cd chart cannot express
# AppProjects in values). Mirrors edp-cluster-add-ons appProjectKRCI and
# https://docs.kuberocketci.io/docs/operator-guide/cd/argocd-integration.
# sourceRepos '*': no git-host coupling; repo credentials come from
# scripts/argocd-integrate.sh.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: krci
  namespace: argocd
spec:
  description: KubeRocketCI deployments
  destinations:
    - namespace: 'krci-*'
      name: in-cluster
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: ''
      kind: NetworkPolicy
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  sourceRepos:
    - '*'
  # KRCI creates its Application CRs in the krci namespace (apps-in-any-namespace).
  sourceNamespaces:
    - krci
