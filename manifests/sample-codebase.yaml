# Go sample Codebase for `make e2e` (GitLab webhook -> Tekton path).
#
# On apply the codebase-operator:
#   1. creates GitLab project krci/test-go-app under the 'krci' group (created by
#      scripts/gitlab-up.sh), scaffolded from the go-gin template (emptyProject: false);
#   2. creates the project webhook to the edp-gitlab EventListener
#      (http://el-gitlab-krci.127.0.0.1.nip.io) with X-Gitlab-Token from the ci-gitlab
#      secret's `secretString` key.
# A push to main runs gitlab-go-gin-app-build-default via the gitlab ClusterInterceptor.
apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: test-go-app
  namespace: krci
spec:
  type: application
  lang: go
  framework: gin
  buildTool: go
  ciTool: tekton
  strategy: create
  emptyProject: false
  defaultBranch: main
  gitServer: gitlab
  gitUrlPath: /krci/test-go-app
  deploymentScript: helm-chart
  versioning:
    type: default
---
apiVersion: v2.edp.epam.com/v1
kind: CodebaseBranch
metadata:
  name: test-go-app-main
  namespace: krci
spec:
  codebaseName: test-go-app
  branchName: main
  release: false
