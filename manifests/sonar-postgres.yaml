# Minimal PostgreSQL backing SonarQube (local kind testbed).
#
# Fulfils the EXACT DB contract the edp-cluster-add-ons `sonar` addon expects via
# its jdbcOverwrite values, so values/sonarqube.yaml needs no DB edits:
#   * Service name : sonar-primary          (jdbc host: sonar-primary.sonar)
#   * Database     : sonar
#   * Port         : 5432
#   * Credentials  : secret sonar-pguser-sonar, key `password` (jdbcSecretPasswordKey)
#
# In the add-ons repo this contract is fulfilled by a Crunchy PGO PostgresCluster
# named `sonar`. Here we use one small stock-postgres Deployment instead (PGO is
# intentionally not installed) — exactly the Tekton Results approach.
---
apiVersion: v1
kind: Namespace
metadata:
  name: sonar
---
apiVersion: v1
kind: Secret
metadata:
  name: sonar-pguser-sonar
  namespace: sonar
type: Opaque
stringData:
  user: sonar
  password: sonar-local-pw
  dbname: sonar
  host: sonar-primary
  port: "5432"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonar-primary-data
  namespace: sonar
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonar-primary
  namespace: sonar
  labels:
    app.kubernetes.io/name: sonar-primary
    app.kubernetes.io/part-of: sonar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sonar-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sonar-primary
        app.kubernetes.io/part-of: sonar
    spec:
      # Restricted-compliant securityContext (harmless in the default-PSA sonar ns).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: sonar
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sonar-pguser-sonar
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonar-pguser-sonar
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d sonar"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonar-primary-data
---
apiVersion: v1
kind: Service
metadata:
  name: sonar-primary
  namespace: sonar
  labels:
    app.kubernetes.io/name: sonar-primary
    app.kubernetes.io/part-of: sonar
spec:
  selector:
    app.kubernetes.io/name: sonar-primary
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
