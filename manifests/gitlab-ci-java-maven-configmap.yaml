# GitLab CI template ConfigMap for KubeRocketCI's GitLab CI path (Codebase ciTool=gitlab).
#
# The codebase-operator (codebase-operator 2.33.0) resolves a .gitlab-ci.yml template
# from a ConfigMap, picked by: the Codebase annotation
# app.edp.epam.com/gitlab-ci-template, then gitlab-ci-{lang}-{buildtool}, then
# gitlab-ci-{lang}, then gitlab-ci-default. It substitutes ONLY {{.CodebaseName}},
# commits the result as .gitlab-ci.yml, and pushes it (no Tekton EventListener).
#
# sample-gitlabci-codebase.yaml points at this ConfigMap by annotation. The body is the
# upstream kuberocketci/ci-java17-mvn orchestration, but the component is pinned to the
# LOCALLY MIRRORED copy (kuberocketci/ci-java17-mvn @0.1.1 on this GitLab — see
# scripts/gitlab-ci-onboard.sh) at a fixed tag, since GitLab CI/CD components only
# resolve on the same instance ($CI_SERVER_FQDN). $CI_SERVER_FQDN, $CI_DEFAULT_BRANCH,
# $CI_REGISTRY_IMAGE etc. are GitLab predefined vars expanded at job time — left literal
# here (the operator only rewrites {{.CodebaseName}}).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-ci-java-maven
  namespace: krci
  labels:
    # Read by krci-portal for template selection; not consumed by the operator.
    app.edp.epam.com/ci-template: gitlab
data:
  description: |
    KubeRocketCI GitLab CI template — Java 17 / Maven (kuberocketci/ci-java17-mvn).
    Mirrored locally for the try-kuberocketci testbed; image pushes to the in-cluster
    GitLab Container Registry (the mirrored build component is patched for it).
  .gitlab-ci.yml: |
    # AUTO-GENERATED by KubeRocketCI codebase-operator (ciTool=gitlab).
    # Project: {{.CodebaseName}}  —  pipeline runs in GitLab CI, not Tekton.
    workflow:
      rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

    variables:
      CODEBASE_NAME: "{{.CodebaseName}}"
      # Java 17 Maven build/test image (multi-arch -> runs native on the arm64 node).
      CONTAINER_IMAGE: "maven:3.9-eclipse-temurin-17"
      # The mirrored build component's buildkit-build is patched to push to the project's
      # own GitLab registry ($CI_REGISTRY_IMAGE); this input is kept for fidelity.
      IMAGE_REGISTRY: "$CI_REGISTRY_IMAGE"
      CHART_DIR: "deploy-templates"

    include:
      # REVIEW — merge-request validation (test/build/lint/sonar/dockerbuild-verify; no push)
      - component: $CI_SERVER_FQDN/kuberocketci/ci-java17-mvn/review@0.1.1
        inputs:
          stage_prepare: prepare
          stage_test: test
          stage_build: build
          stage_verify: verify
          codebase_name: ${CODEBASE_NAME}
          container_image: ${CONTAINER_IMAGE}
          chart_dir: ${CHART_DIR}
        rules:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"

      # BUILD — default/protected branch: build, push image, deploy/tag
      - component: $CI_SERVER_FQDN/kuberocketci/ci-java17-mvn/build@0.1.1
        inputs:
          stage_prepare: prepare
          stage_test: test
          stage_build: build
          stage_package: package
          stage_publish: publish
          codebase_name: ${CODEBASE_NAME}
          container_image: ${CONTAINER_IMAGE}
          image_registry: ${IMAGE_REGISTRY}
          chart_dir: ${CHART_DIR}
        rules:
          - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true"

    stages: [prepare, test, build, verify, package, publish, release]

    # GitLab needs at least one visible job in the orchestration file; never runs.
    visible-job-lint-fix:
      stage: .pre
      rules: [when: never]
      script: [echo "placeholder"]
