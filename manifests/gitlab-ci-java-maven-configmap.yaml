# .gitlab-ci.yml template for Codebases with ciTool=gitlab.
#
# codebase-operator >= 2.33.0 resolves the template ConfigMap in this order: Codebase
# annotation app.edp.epam.com/gitlab-ci-template, gitlab-ci-{lang}-{buildtool},
# gitlab-ci-{lang}, gitlab-ci-default. It substitutes {{.CodebaseName}} only and
# commits the result as .gitlab-ci.yml (no Tekton EventListener).
#
# Body = the upstream kuberocketci/ci-java17-mvn orchestration with the component pinned
# to the local mirror (kuberocketci/ci-java17-mvn @0.1.1 on this GitLab, seeded by
# scripts/gitlab-ci-onboard.sh): CI/CD components resolve only on the same instance
# ($CI_SERVER_FQDN). $CI_* are GitLab predefined variables, expanded at job time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-ci-java-maven
  namespace: krci
  labels:
    # Read by krci-portal for template selection; not consumed by the operator.
    app.edp.epam.com/ci-template: gitlab
data:
  description: |
    KubeRocketCI GitLab CI template — Java 17 / Maven (kuberocketci/ci-java17-mvn).
    Mirrored locally for the try-kuberocketci testbed; image pushes to the in-cluster
    GitLab Container Registry (the mirrored build component is patched for it).
  .gitlab-ci.yml: |
    # AUTO-GENERATED by KubeRocketCI codebase-operator (ciTool=gitlab).
    # Project: {{.CodebaseName}}  —  pipeline runs in GitLab CI, not Tekton.
    workflow:
      rules:
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_REF_PROTECTED == "true"
        - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/

    variables:
      CODEBASE_NAME: "{{.CodebaseName}}"
      # Multi-arch image: runs native on the arm64 node.
      CONTAINER_IMAGE: "maven:3.9-eclipse-temurin-17"
      # The mirrored build component pushes to the project's own GitLab registry
      # ($CI_REGISTRY_IMAGE).
      IMAGE_REGISTRY: "$CI_REGISTRY_IMAGE"
      CHART_DIR: "deploy-templates"

    include:
      # REVIEW — merge-request validation (test/build/lint/sonar/dockerbuild-verify; no push)
      - component: $CI_SERVER_FQDN/kuberocketci/ci-java17-mvn/review@0.1.1
        inputs:
          stage_prepare: prepare
          stage_test: test
          stage_build: build
          stage_verify: verify
          codebase_name: ${CODEBASE_NAME}
          container_image: ${CONTAINER_IMAGE}
          chart_dir: ${CHART_DIR}
        rules:
          - if: $CI_PIPELINE_SOURCE == "merge_request_event"

      # BUILD — default/protected branch: build, push image, deploy/tag
      - component: $CI_SERVER_FQDN/kuberocketci/ci-java17-mvn/build@0.1.1
        inputs:
          stage_prepare: prepare
          stage_test: test
          stage_build: build
          stage_package: package
          stage_publish: publish
          codebase_name: ${CODEBASE_NAME}
          container_image: ${CONTAINER_IMAGE}
          image_registry: ${IMAGE_REGISTRY}
          chart_dir: ${CHART_DIR}
        rules:
          - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_REF_PROTECTED == "true"

    stages: [prepare, test, build, verify, package, publish, release]

    # GitLab needs at least one visible job in the orchestration file; never runs.
    visible-job-lint-fix:
      stage: .pre
      rules: [when: never]
      script: [echo "placeholder"]
