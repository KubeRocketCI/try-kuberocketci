# Patched edp-tekton `npm` Task for GitLab Package Registry builds (local deviation;
# only what .npmrc cannot express). Chart-owned: Helm SSA resets it on every
# `make krci`; scripts/gitlab-integrate.sh re-applies it with --force-conflicts.
#
# Deltas vs chart-stock; all no-ops on the Nexus default path:
#   - derive-project pre-step: CI_PROJECT_ID (url-encoded group%2Fname) from the repo's
#     git remote, referenced by the publish .npmrc.
#   - npm step: exports CI_PROJECT_ID (npm expands ${CI_PROJECT_ID} from .npmrc) and
#     NODE_EXTRA_CA_CERTS for GitLab's self-signed TLS. NODE_EXTRA_CA_CERTS adds to
#     Node's bundled roots, so registry.npmjs.org still verifies (python's PIP_CERT
#     replaces the store and needs a merged bundle).
#   - extra volumes: gitlab-ca (ConfigMap, from gitlab-up) + trust (emptyDir).
#   - NPM_CACHE_DIR env (see the npm step).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: npm
  namespace: krci
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1"
  annotations:
    meta.helm.sh/release-name: edp
    meta.helm.sh/release-namespace: krci
    tekton.dev/categories: Build Tools
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le
    tekton.dev/tags: build-tool
spec:
  description: >-
    Runs npm goals with GitLab Package Registry integration: npm resolves from the krci
    group registry (which forwards misses to registry.npmjs.org), npm publish targets the
    codebase's own project registry using the deploy token from secret ci-nexus.
  params:
  - default: .
    description: The path where package.json of the project is defined.
    name: PATH_CONTEXT
    type: string
  - name: EXTRA_COMMANDS
    type: string
  - default: docker.io/library/node:24.18.0-alpine3.24
    description: The node image you want to use.
    name: BASE_IMAGE
    type: string
  - default: ci-nexus
    description: name of the secret for the artifact-registry integration
    name: ci-nexus
    type: string
  - default: /workspace/source/cache
    description: The path to the cache directory.
    name: CACHE_DIR
    type: string
  steps:
  - name: derive-project
    image: $(params.BASE_IMAGE)
    computeResources: {}
    script: |
      #!/usr/bin/env sh
      set -e
      # CI_PROJECT_ID = url-encoded group%2Fname from the origin remote; GitLab accepts it
      # as :id. Empty when not a git repo (review-only goals never publish).
      cfg="$(workspaces.source.path)/$(params.PATH_CONTEXT)/.git/config"
      url="$(awk '/\[remote "origin"\]/{f=1;next} f&&/^[[:space:]]*url[[:space:]]*=/{sub(/^[^=]*=[[:space:]]*/,"");print;exit}' "$cfg" 2>/dev/null || true)"
      ns="$(printf '%s' "${url%.git}" | awk -F'[/:]' 'NF>=2{print $(NF-1)"/"$NF}')"
      enc="$(printf '%s' "$ns" | sed 's#/#%2F#g')"
      printf '%s' "$enc" > /trust/ci_project_id
      echo "[TEKTON][INFO] CI_PROJECT_ID='$enc' (from origin '$url')"
    volumeMounts:
    - { name: trust, mountPath: /trust }
  - name: npm
    image: $(params.BASE_IMAGE)
    computeResources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 1Gi
    env:
    - name: HOME
      value: $(workspaces.source.path)
    - name: CI_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: $(params.ci-nexus)
    - name: CI_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: $(params.ci-nexus)
    - name: NEXUS_HOST_URL
      valueFrom:
        secretKeyRef:
          key: url
          name: $(params.ci-nexus)
    # Every .npmrc sets `cache=${NPM_CACHE_DIR}`; chart-stock exports it only in edp-npm.
    # Unset, npm keeps the literal and creates a '${NPM_CACHE_DIR}' directory in the repo
    # root right before `npm publish` packs it.
    - name: NPM_CACHE_DIR
      value: $(params.CACHE_DIR)
    script: |
      #!/usr/bin/env sh
      set -e

      export CI_PROJECT_ID="$(cat /trust/ci_project_id 2>/dev/null || true)"
      [ -f /var/gitlab-ca/gitlab-ca.crt ] && export NODE_EXTRA_CA_CERTS=/var/gitlab-ca/gitlab-ca.crt
      echo "[TEKTON][INFO] CI_PROJECT_ID contains ${CI_PROJECT_ID}"

      $(params.EXTRA_COMMANDS)
    volumeMounts:
    - { name: settings-npm, mountPath: /var/configmap }
    - { name: gitlab-ca, mountPath: /var/gitlab-ca }
    - { name: trust, mountPath: /trust }
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
  volumes:
  - configMap:
      name: gitlab-npm-settings
    name: settings-npm
  - configMap:
      name: gitlab-ca
    name: gitlab-ca
  - emptyDir: {}
    name: trust
  workspaces:
  - name: source
