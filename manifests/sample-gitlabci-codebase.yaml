# Java/Maven sample Codebase for `make e2e-gitlabci`: CI runs in GitLab CI, not Tekton.
#
# ciTool=gitlab (codebase-operator >= 2.33.0): the operator creates no Tekton
# EventListener/webhook and pushes a .gitlab-ci.yml resolved from the ConfigMap named by
# the annotation below. Jobs run on the in-cluster GitLab Runner (`make gitlab-ci`). The
# `gitlab` GitServer is shared with the Tekton codebases; tektonDisabled is not needed.
#
# strategy=import: scripts/gitlab-ci-onboard.sh seeds the repo from the upstream
# ci-java17-mvn sample without its .gitlab-ci.yml. Import skips PutProject; the operator
# still runs PutGitLabCIConfig (clone, inject .gitlab-ci.yml, push).
apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: java-gitlabci-app
  namespace: krci
  annotations:
    # Template ConfigMap. Fallback order without it: gitlab-ci-java-maven ->
    # gitlab-ci-java -> gitlab-ci-default.
    app.edp.epam.com/gitlab-ci-template: gitlab-ci-java-maven
spec:
  type: application
  lang: java
  framework: java17
  buildTool: maven
  ciTool: gitlab
  strategy: import
  emptyProject: false
  defaultBranch: main
  gitServer: gitlab
  gitUrlPath: /krci/java-gitlabci-app
  deploymentScript: helm-chart
  # The seeded sample ships its own chart in deploy-templates/ (used by the helm-lint /
  # helm-docs jobs); the operator must not overwrite it with the generic KRCI chart.
  disablePutDeployTemplates: true
  versioning:
    type: default
---
apiVersion: v2.edp.epam.com/v1
kind: CodebaseBranch
metadata:
  name: java-gitlabci-app-main
  namespace: krci
spec:
  codebaseName: java-gitlabci-app
  branchName: main
  release: false
