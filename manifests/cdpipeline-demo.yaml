# e2e CD: CDPipeline "demo" with one Stage "dev" deploying test-go-app into
# krci-demo-dev via Argo CD.
#
# Applied by scripts/e2e.sh right after the Codebase is provisioned. Ordering:
#   - the cdpipeline.epam.com validating webhook requires every inputDockerStreams
#     entry (CodebaseImageStream test-go-app-main) to exist; empty is fine;
#   - the Stage must exist before the build: triggerType Auto fires on the
#     CodebaseImageStream update, and the cd-pipeline-operator then creates the
#     CDStageDeploy that runs the deploy.
apiVersion: v2.edp.epam.com/v1
kind: CDPipeline
metadata:
  name: demo
  namespace: krci
spec:
  name: demo
  deploymentType: container
  applications:
    - test-go-app
  applicationsToPromote:
    - test-go-app
  # CodebaseImageStream <codebase>-<branch>; the build pipeline records the image tag here.
  inputDockerStreams:
    - test-go-app-main
---
apiVersion: v2.edp.epam.com/v1
kind: Stage
metadata:
  # The validating webhook requires the Stage CR name "<cdPipeline>-<stage>".
  name: demo-dev
  namespace: krci
spec:
  name: dev
  cdPipeline: demo
  description: "Dev environment (e2e deploy of the freshly built image)."
  # 0-based.
  order: 0
  # Auto: the operator creates a CDStageDeploy on each CodebaseImageStream update.
  triggerType: Auto
  triggerTemplate: deploy
  clusterName: in-cluster
  # krci-<pipeline>-<stage>; the codebase's deploy-templates chart syncs here.
  namespace: krci-demo-dev
  source:
    type: default
  qualityGates:
    - qualityGateType: manual
      stepName: manual
