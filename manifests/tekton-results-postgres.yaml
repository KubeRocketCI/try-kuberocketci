# Minimal PostgreSQL for Tekton Results (local kind testbed): a stock postgres Deployment
# in place of the add-ons' Crunchy PGO PostgresCluster `results` (PGO is not installed).
# DB contract expected by manifests/tekton-results.yaml (verbatim edp-cluster-add-ons):
#   * Service name     : results-primary            (DB_HOST in the api ConfigMap)
#   * Database         : results                    (DB_NAME)
#   * Port             : 5432                        (DB_PORT)
#   * Credentials      : secret results-pguser-results, keys `user` / `password`
#                        (DB_USER / DB_PASSWORD env in the api + retention pods)
---
apiVersion: v1
kind: Secret
metadata:
  name: results-pguser-results
  namespace: tekton-pipelines
type: Opaque
stringData:
  user: results
  password: tekton-results-local-pw
  dbname: results
  host: results-primary
  port: "5432"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: results-primary-data
  namespace: tekton-pipelines
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: results-primary
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: results-primary
    app.kubernetes.io/part-of: tekton-results
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: results-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: results-primary
        app.kubernetes.io/part-of: tekton-results
    spec:
      # tekton-pipelines enforces PodSecurity restricted: pod + container need a compliant
      # securityContext. postgres:16-alpine runs as any non-root UID; PGDATA is on the
      # fsGroup-owned volume.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: results
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: results-pguser-results
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: results-pguser-results
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d results"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: results-primary-data
---
apiVersion: v1
kind: Service
metadata:
  name: results-primary
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/name: results-primary
    app.kubernetes.io/part-of: tekton-results
spec:
  selector:
    app.kubernetes.io/name: results-primary
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
