# LOCAL-ONLY sensitive env for the in-cluster Portal; mounted via envFrom
# (values/edp-install.yaml -> krci-portal.extraEnvFrom), applied before the chart.
#   SERVER_SECRET       session-cookie signing key (min 32 chars).
#   OIDC_CLIENT_SECRET  placeholder (no OIDC issuer in kind; non-empty for the startup check).
# Throwaway local creds — never reuse on a shared/production cluster.
apiVersion: v1
kind: Secret
metadata:
  name: krci-portal-secret
  labels:
    app.kubernetes.io/part-of: krci-portal
type: Opaque
stringData:
  SERVER_SECRET: "krci-local-portal-session-secret-change-me-0123456789"
  OIDC_CLIENT_SECRET: "local-dev-oidc-client-secret-placeholder"
