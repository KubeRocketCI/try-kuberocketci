# Local-only Portal env, mounted via envFrom (krci-portal extraEnvFrom in the values).
# Must exist before the chart install.
#   SERVER_SECRET  session-cookie signing key, min 32 chars.
# OIDC is off (empty OIDC_ISSUER_URL in configEnv): no OIDC secrets; login is
# ServiceAccount-token only. Never reuse these values on a shared cluster.
apiVersion: v1
kind: Secret
metadata:
  name: krci-portal-secret
  labels:
    app.kubernetes.io/part-of: krci-portal
type: Opaque
stringData:
  SERVER_SECRET: "krci-local-portal-session-secret-change-me-0123456789"
