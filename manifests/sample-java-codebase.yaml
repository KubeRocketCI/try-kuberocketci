# Java/Maven sample Codebase for `make e2e-java` (GitLab Package Registry path).
#
# The maven tasks resolve from Maven Central + the krci group endpoint and publish
# (`mvn deploy`) to the per-project endpoint, using secret ci-nexus, cm
# gitlab-maven-settings and the patched maven task (wired by gitlab-up/gitlab-integrate).
# strategy: create scaffolds github.com/epmd-edp/java-maven-java17 (template =
# lang-buildTool-framework) into GitLab project krci/test-java-app.
apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: test-java-app
  namespace: krci
spec:
  type: application
  lang: java
  framework: java17
  buildTool: maven
  ciTool: tekton
  strategy: create
  emptyProject: false
  defaultBranch: main
  gitServer: gitlab
  gitUrlPath: /krci/test-java-app
  deploymentScript: helm-chart
  versioning:
    type: default
---
apiVersion: v2.edp.epam.com/v1
kind: CodebaseBranch
metadata:
  name: test-java-app-main
  namespace: krci
spec:
  codebaseName: test-java-app
  branchName: main
  release: false
