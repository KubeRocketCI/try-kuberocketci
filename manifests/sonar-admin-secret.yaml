# SonarQube admin credentials. Must exist before the SonarQube helm install. Consumers:
#   * chart `setAdminPassword` post-install hook (values/sonarqube.yaml): reads
#     `password` (new) + `currentPassword` (default "admin") and changes admin on first
#     startup, which satisfies the forced first-login password change.
#   * Sonar CR (manifests/sonar-operator-crs.yaml): reads `user` + `password` for the
#     SonarQube API.
# Each consumer ignores the keys it does not use. Local testbed only.
# Re-install: the hook's change_password gets a 401 (admin already changed) and admin
# keeps `password`; curl runs without --fail, so the hook still succeeds.
apiVersion: v1
kind: Secret
metadata:
  name: sonar-admin-password
  namespace: sonar
type: Opaque
stringData:
  user: admin
  password: "KrciSonar_2026!"
  currentPassword: admin
