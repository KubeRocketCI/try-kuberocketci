# SonarQube admin credentials — serves TWO consumers, so it must exist BEFORE the
# SonarQube helm install (the chart's post-install hook reads it):
#   * chart `setAdminPassword` hook (values/sonarqube.yaml) reads `password` (new) +
#     `currentPassword` (the default "admin") and changes admin on first startup, so the
#     forced first-login password change is done automatically — no manual UI step.
#   * edp-sonar-operator's Sonar CR (manifests/sonar-operator-crs.yaml) reads `user` +
#     `password` to authenticate to the SonarQube API.
# Each consumer ignores the keys it doesn't use. Local testbed only.
#
# Re-run note: `currentPassword` stays "admin"; on a re-install where admin is already
# the new password the hook's change_password just 401s (curl has no --fail) and admin
# keeps the new password — harmless. (Idempotent for the install-once testbed.)
apiVersion: v1
kind: Secret
metadata:
  name: sonar-admin-password
  namespace: sonar
type: Opaque
stringData:
  user: admin
  password: "KrciSonar_2026!"
  currentPassword: admin
