# GitLab Package Registry .npmrc files for the edp-tekton npm/pnpm tasks (local
# deviation from the chart-stock custom-npm-settings ConfigMap, which targets Nexus).
#
# values/edp-install.yaml sets tekton.configs.npmConfigMap to this name: the chart renders
# no copy and does not own this object; the `npm`, `edp-npm` and `edp-pnpm` tasks mount
# it. npm and pnpm expand ${VAR} from the environment when reading .npmrc, so
# ${CI_PROJECT_ID} (set by the npm task patch) and ${CI_PASSWORD} stay literal here.
#
# Resolve from the group registry (forwards misses to registry.npmjs.org); publish to
# the codebase's own project registry. Auth: _authToken = the krci-packages deploy
# token, valid for read and publish (Basic _auth authenticates reads only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-npm-settings
  namespace: krci
# The _authToken key must use the exact registry path: npm matches credentials by the
# registry "nerf dart"; a shorter prefix such as //host/api/v4/ fails `npm publish`
# with ENEEDAUTH.
data:
  .npmrc-ci: |
    registry=https://gitlab.127.0.0.1.nip.io/api/v4/groups/krci/-/packages/npm/
    //gitlab.127.0.0.1.nip.io/api/v4/groups/krci/-/packages/npm/:_authToken=${CI_PASSWORD}
    cache=${NPM_CACHE_DIR}
  .npmrc-publish-snapshots: |
    registry=https://gitlab.127.0.0.1.nip.io/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    //gitlab.127.0.0.1.nip.io/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_PASSWORD}
    cache=${NPM_CACHE_DIR}
  .npmrc-publish-releases: |
    registry=https://gitlab.127.0.0.1.nip.io/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
    //gitlab.127.0.0.1.nip.io/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_PASSWORD}
    cache=${NPM_CACHE_DIR}
