# GitLab Package Registry paths for the edp-tekton `python` build task (local deviation
# from the chart-stock custom-python-settings ConfigMap, which targets Nexus).
#
# The chart's python task hardcodes the ConfigMap name instead of reading
# tekton.configs.pythonConfigMap: this name is referenced by the python task patch
# (manifests/python-task-gitlab.yaml); the values key only stops the stock copy from
# rendering. Applied unchanged by scripts/gitlab-integrate.sh.
#
# Resolve from the group endpoint; publish to the codebase's own project. The group PyPI
# index forwards misses to pypi.org (GitLab package forwarding, default on, available on
# CE). ${CI_PROJECT_ID} stays literal; the python task expands it at run time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-python-settings
  namespace: krci
data:
  PIP_INDEX_PATH: "/api/v4/groups/krci/-/packages/pypi/simple"
  PIP_INDEX_URL_PATH: "/api/v4/groups/krci/-/packages/pypi/simple"
  REPOSITORY_SNAPSHOTS_PATH: "/api/v4/projects/${CI_PROJECT_ID}/packages/pypi"
  REPOSITORY_RELEASES_PATH: "/api/v4/projects/${CI_PROJECT_ID}/packages/pypi"
