# Cluster-scope RBAC for apps-in-any-namespace (applicationsetcontroller.namespaces=krci):
# the ApplicationSet controller must list/watch/manage Applications + ApplicationSets
# cluster-wide, which the argo-cd chart does not grant. Missing -> controller logs
#   applications.argoproj.io is forbidden: ... cannot list resource "applications" at the cluster scope
# Source: edp-cluster-add-ons argo-cd/templates/rbac-hack. Applied by `make argocd`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-applicationset-admin
rules:
  - verbs: ["create", "patch"]
    apiGroups: ['']
    resources: ["events"]
  - verbs: ["get", "list", "watch"]
    apiGroups: ['']
    resources: ["secrets"]
  - verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
    apiGroups: ["argoproj.io"]
    resources: ["applications", "applicationsets/status"]
  - verbs: ["get", "list", "patch", "update", "watch"]
    apiGroups: ["argoproj.io"]
    resources: ["applicationsets"]
  # Argo CD >= 3.4: the appset controller also watches AppProjects cluster-wide to
  # validate the generated Application's project. Not in the add-ons rbac-hack.
  - verbs: ["get", "list", "watch"]
    apiGroups: ["argoproj.io"]
    resources: ["appprojects"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-applicationset-admin
subjects:
  - kind: ServiceAccount
    name: argocd-applicationset-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-applicationset-admin
