# KubeRocketCI GitOps repository: the Codebase + CodebaseBranch the Portal's
# "Add GitOps repository" creates.
#
# Required before any CDPipeline: the deploy flow commits Helm values here. A `system`
# codebase (labels codebaseType=system + systemType=gitops, lang/framework helm/gitops)
# creates no CodebaseImageStream, so it needs no container registry.
# strategy: create scaffolds the gitops Helm template into krci/krci-gitops; the
# codebase-operator wires the project webhook.
apiVersion: v2.edp.epam.com/v1
kind: Codebase
metadata:
  name: krci-gitops
  namespace: krci
  labels:
    app.edp.epam.com/codebaseType: system
    app.edp.epam.com/systemType: gitops
spec:
  type: system
  lang: helm
  framework: gitops
  buildTool: helm
  ciTool: tekton
  strategy: create
  emptyProject: false
  defaultBranch: main
  gitServer: gitlab
  gitUrlPath: /krci/krci-gitops
  deploymentScript: helm-chart
  private: false
  versioning:
    type: semver
    startFrom: 0.1.0-SNAPSHOT
---
apiVersion: v2.edp.epam.com/v1
kind: CodebaseBranch
metadata:
  name: krci-gitops-main
  namespace: krci
spec:
  codebaseName: krci-gitops
  branchName: main
  # Required for semver versioning (matches spec.versioning.startFrom).
  version: 0.1.0-SNAPSHOT
  release: false
