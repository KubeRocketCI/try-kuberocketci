# Patched edp-tekton `edp-npm` Task (the npm BUILD task) for GitLab-hosted dependencies.
#
# The `npm` task publishes; this one RESOLVES — `npm ci` in the init step pulls from the
# krci group registry named in .npmrc-ci. That is an HTTPS call to GitLab's self-signed
# endpoint, so without the CA it dies with DEPTH_ZERO_SELF_SIGNED_CERT before any build
# runs. The .npmrc has no usable TLS knob here (npm's `cafile` would need the CA file to
# be mounted, which is the very thing missing), so this is a task-level delta.
#
# Delta vs chart-stock — one row:
#   - init step: NODE_EXTRA_CA_CERTS + the gitlab-ca ConfigMap volume. ADDITIVE to Node's
#     bundled roots, so registry.npmjs.org (reached via the group registry's forwarding)
#     still verifies, and it is a no-op when the ConfigMap is absent.
# scripts/gitlab-integrate.sh re-applies this AFTER `make krci` with --force-conflicts.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: edp-npm
  namespace: krci
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.1"
  annotations:
    meta.helm.sh/release-name: edp
    meta.helm.sh/release-namespace: krci
    tekton.dev/categories: Build Tools
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/platforms: linux/amd64,linux/s390x,linux/ppc64le
    tekton.dev/tags: build-tool
spec:
  description: >-
    Runs npm build goals, resolving dependencies from the krci group registry over
    GitLab's self-signed TLS.
  params:
  - default: source
    description: The path where package.json of the project is defined.
    name: PATH_CONTEXT
    type: string
  - default: docker.io/library/node:24.18.0-alpine3.24
    description: The node image you want to use.
    name: BASE_IMAGE
    type: string
  - default: ci-nexus
    description: name of the secret for the artifact-registry integration
    name: ci-nexus
    type: string
  - default: ci-sonarqube
    description: name of the secret for the Sonarqube integration
    name: ci-sonarqube
    type: string
  - default: /workspace/source/cache
    description: The path to the cache directory.
    name: CACHE_DIR
    type: string
  steps:
  - name: init
    image: $(params.BASE_IMAGE)
    computeResources: {}
    env:
    - name: HOME
      value: $(workspaces.source.path)/
    - name: CI_USERNAME
      valueFrom:
        secretKeyRef:
          key: username
          name: $(params.ci-nexus)
    - name: CI_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: $(params.ci-nexus)
    - name: NEXUS_HOST_URL
      valueFrom:
        secretKeyRef:
          key: url
          name: $(params.ci-nexus)
    - name: NPM_CACHE_DIR
      value: $(params.CACHE_DIR)
    script: |
      #!/usr/bin/env sh
      set -e

      [ -f /var/gitlab-ca/gitlab-ca.crt ] && export NODE_EXTRA_CA_CERTS=/var/gitlab-ca/gitlab-ca.crt
      export upBase64=$(echo -n ${CI_USERNAME}:${CI_PASSWORD} | base64)
      export npm_config_userconfig=/var/configmap/.npmrc-ci
      export NEXUS_HOST="//${NEXUS_HOST_URL#*://}"
      npm cache verify --cache $NPM_CACHE_DIR
      npm ci
    volumeMounts:
    - mountPath: /var/configmap
      name: settings-npm
    - mountPath: /var/gitlab-ca
      name: gitlab-ca
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
  - name: build
    image: $(params.BASE_IMAGE)
    computeResources: {}
    script: |
      npm run build
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
  - name: test
    image: $(params.BASE_IMAGE)
    computeResources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 1Gi
    script: |
      npm run test:coverage
    workingDir: $(workspaces.source.path)/$(params.PATH_CONTEXT)
  volumes:
  - configMap:
      name: gitlab-npm-settings
    name: settings-npm
  - configMap:
      name: gitlab-ca
    name: gitlab-ca
  workspaces:
  - name: source
