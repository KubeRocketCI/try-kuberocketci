# kind cluster for the KubeRocketCI local test harness.
# Single node, control-plane also schedules workloads.
# Ports 80/443 are mapped to localhost so the NGINX ingress (and thus the
# KubeRocketCI Portal / GitLab) is reachable from the host browser at
# *.127.0.0.1.nip.io
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: krci
# Enable containerd's per-registry hosts.d config so the node can pull images from the
# self-hosted GitLab registry. The deployed workloads reference
# gitlab.127.0.0.1.nip.io:5050/... but containerd (on the node) resolves that host to
# 127.0.0.1 (nip.io) — the CoreDNS split-horizon rewrite only helps in-cluster pods, not
# the node's image pulls. scripts/gitlab-up.sh drops a hosts.toml under this path that
# mirrors the registry host to the GitLab service ClusterIP (skip_verify for self-signed).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
