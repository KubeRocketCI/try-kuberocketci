# kind cluster for the KubeRocketCI local test harness: single node, workloads on the
# control-plane. Node image (= Kubernetes version): Makefile KIND_NODE_IMAGE.
# Host ports 80/443 -> the NGINX ingress; UIs resolve via *.127.0.0.1.nip.io.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: krci
# containerd per-registry hosts.d config for the self-hosted GitLab registry. Workloads
# reference gitlab.127.0.0.1.nip.io:5050/...; on the node that host resolves to 127.0.0.1
# (the CoreDNS rewrite covers pods only). scripts/gitlab-up.sh writes a hosts.toml under
# this path mirroring the host to the GitLab service ClusterIP (skip_verify: self-signed).
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
